<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Image Sight workflow diagram">
  <title>Image Sight — Detect, Extract, Interpret, Report Honestly</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/>
    </marker>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" fill="#0b1220"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e5e7eb">Image Sight Workflow</text>
  <text x="500" y="56" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9ca3af">Detect → Extract → Interpret → Report honestly (for text-only models)</text>

  <!-- Pipeline boxes -->
  <!-- 1 Input -->
  <g transform="translate(40,90)">
    <rect width="150" height="78" rx="10" fill="url(#box)" stroke="#374151"/>
    <text x="75" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#e5e7eb">1. Confirm image</text>
    <text x="75" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">ls uploads / URL</text>
    <text x="75" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">ask if missing</text>
  </g>

  <!-- arrow 1->2 -->
  <line x1="190" y1="129" x2="225" y2="129" stroke="#5b8def" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 Inspect -->
  <g transform="translate(230,90)">
    <rect width="170" height="78" rx="10" fill="url(#box)" stroke="#374151"/>
    <text x="85" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#e5e7eb">2. Run inspect_image.py</text>
    <text x="85" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">modes: auto / text</text>
    <text x="85" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">describe / full</text>
  </g>

  <line x1="400" y1="129" x2="435" y2="129" stroke="#5b8def" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 Classify -->
  <g transform="translate(440,90)">
    <rect width="160" height="78" rx="10" fill="url(#box)" stroke="#374151"/>
    <text x="80" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#e5e7eb">3. Classify type</text>
    <text x="80" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">playbook pick</text>
    <text x="80" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">(receipt, chart, ...)</text>
  </g>

  <line x1="600" y1="129" x2="635" y2="129" stroke="#5b8def" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 Improve -->
  <g transform="translate(640,90)">
    <rect width="160" height="78" rx="10" fill="url(#box)" stroke="#374151"/>
    <text x="80" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#e5e7eb">4. Improve weak</text>
    <text x="80" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">preprocess, psm</text>
    <text x="80" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">lang packs</text>
  </g>

  <line x1="800" y1="129" x2="835" y2="129" stroke="#5b8def" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 Answer -->
  <g transform="translate(840,90)">
    <rect width="130" height="78" rx="10" fill="url(#box)" stroke="#374151"/>
    <text x="65" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#e5e7eb">5. Answer</text>
    <text x="65" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">lead w/ answer</text>
    <text x="65" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#9ca3af">quote text, limits</text>
  </g>

  <!-- Verify numbers row -->
  <g transform="translate(40,200)">
    <rect width="930" height="46" rx="10" fill="#111827" stroke="#374151"/>
    <text x="465" y="28" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#e5e7eb">6. Verify numbers — cross-check arithmetic (invoices, receipts, charts, tables); flag mismatches as likely OCR errors</text>
  </g>

  <!-- Tools strip -->
  <text x="500" y="278" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#9ca3af">Tools used</text>
  <g transform="translate(40,290)">
    <rect width="170" height="44" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="85" y="20" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#e5e7eb">Tesseract OCR</text>
    <text x="85" y="36" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#9ca3af">core text recognition</text>
  </g>
  <g transform="translate(230,290)">
    <rect width="170" height="44" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="85" y="20" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#e5e7eb">EasyOCR</text>
    <text x="85" y="36" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#9ca3af">fallback (stylized, signs)</text>
  </g>
  <g transform="translate(420,290)">
    <rect width="170" height="44" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="85" y="20" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#e5e7eb">Pillow</text>
    <text x="85" y="36" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#9ca3af">metadata, palette, preprocess</text>
  </g>
  <g transform="translate(610,290)">
    <rect width="170" height="44" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="85" y="20" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#e5e7eb">BLIP (optional)</text>
    <text x="85" y="36" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#9ca3af">one-line captioning</text>
  </g>
  <g transform="translate(800,290)">
    <rect width="170" height="44" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="85" y="20" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#e5e7eb">Vision API</text>
    <text x="85" y="36" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#9ca3af">last resort (consent)</text>
  </g>
</svg>
